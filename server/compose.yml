name: cy-pregnancy-admin
services:
  admin-api:
    image: ${DEPLOY_IMAGE:?请通过 Jenkins 发布或指定 DEPLOY_IMAGE}
    container_name: admin-api
    restart: unless-stopped
    init: true
    mem_limit: ${API_MEMORY_LIMIT:-640m}
    pids_limit: 256
    stop_grace_period: 60s
    ports:
      - '127.0.0.1:18732:18732'
    env_file:
      - ${DEPLOY_ENV_FILE:?请通过 Jenkins Secret file 凭据注入配置}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ADMIN_SERVER_PORT: '18732'
      SERVER_TOMCAT_THREADS_MAX: '40'
      SERVER_TOMCAT_THREADS_MIN_SPARE: '5'
      SERVER_TOMCAT_ACCEPT_COUNT: '50'
    logging:
      driver: local
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      service-internal:
        aliases: [admin-api]
networks:
  service-internal:
    external: true
    name: ${SERVICE_NETWORK:-cy-pregnancy-internal}
