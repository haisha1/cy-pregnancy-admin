services:
  admin-api:
    build: .
    restart: unless-stopped
    ports:
      - '127.0.0.1:18732:18732'
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ADMIN_DB_URL: 'jdbc:mysql://admin-mysql:3306/cy_pregnancy_admin?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC'
      ADMIN_DB_USERNAME: pregnancy_admin
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:?Set ADMIN_DB_PASSWORD}
      ADMIN_REDIS_HOST: admin-redis
      ADMIN_REDIS_PASSWORD: ${ADMIN_REDIS_PASSWORD:?Set ADMIN_REDIS_PASSWORD}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?Set ADMIN_JWT_SECRET}
      ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED:-false}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-initial_admin}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_READ_KEY: ${ADMIN_READ_KEY:?Set shared ADMIN_READ_KEY}
      CONTENT_READ_KEY: ${CONTENT_READ_KEY:?Set shared CONTENT_READ_KEY}
      USER_READ_URL: http://user-api:18731
    networks:
      default:
      service-internal:
        aliases: [admin-api]
    depends_on:
      admin-mysql:
        condition: service_healthy
      admin-redis:
        condition: service_healthy
  admin-mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cy_pregnancy_admin
      MYSQL_USER: pregnancy_admin
      MYSQL_PASSWORD: ${ADMIN_DB_PASSWORD:?Set ADMIN_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${ADMIN_MYSQL_ROOT_PASSWORD:?Set ADMIN_MYSQL_ROOT_PASSWORD}
      TZ: UTC
    volumes:
      - admin-mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -u pregnancy_admin -D cy_pregnancy_admin -e "SELECT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 15
  admin-redis:
    image: redis:7.4
    restart: unless-stopped
    environment:
      ADMIN_REDIS_PASSWORD: ${ADMIN_REDIS_PASSWORD:?Set ADMIN_REDIS_PASSWORD}
    command: ['sh', '-c', 'exec redis-server --requirepass "$$ADMIN_REDIS_PASSWORD"']
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$ADMIN_REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  admin-mysql-data:
networks:
  service-internal:
    external: true
    name: ${SERVICE_NETWORK:-cy-pregnancy-internal}
