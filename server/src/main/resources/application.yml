# 基础配置。local=本地依赖；remote=本机经 SSH 访问远程依赖；prod=Jenkins 容器部署。
# 连接覆盖写入 .local/connections-*.properties，生产配置使用 Jenkins Secret file。
spring:
  application:
    name: cy-pregnancy-admin-server
  profiles:
    default: local
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${ADMIN_DB_URL:jdbc:mysql://localhost:3306/cy_pregnancy_admin?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${ADMIN_DB_USERNAME:root}
    password: ${ADMIN_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
  redis:
    host: ${ADMIN_REDIS_HOST:localhost}
    port: ${ADMIN_REDIS_PORT:6379}
    password: ${ADMIN_REDIS_PASSWORD:}
    timeout: 2s
  flyway:
    clean-disabled: true
    baseline-on-migrate: false
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
server:
  port: ${ADMIN_SERVER_PORT:18732}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  user-read:
    url: ${USER_READ_URL:http://127.0.0.1:18731}
    key: ${ADMIN_READ_KEY:}
  auth:
    secret: ${ADMIN_JWT_SECRET:}
    issuer: cy-pregnancy-admin
    access-seconds: 1800
    bootstrap-enabled: false
    bootstrap-username: ${ADMIN_BOOTSTRAP_USERNAME:local_admin}
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
